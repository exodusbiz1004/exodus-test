<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>레트로 아케이드 테트리스 (사운드 효과)</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel-bg: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1e293b 0%, #0b0f19 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #38bdf8;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .main-layout {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      justify-content: center;
      max-width: 600px;
      width: 100%;
    }

    /* 게임 보드 */
    .game-board-container {
      position: relative;
      background: #000;
      border: 3px solid #38bdf8;
      border-radius: 10px;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.25);
      line-height: 0;
    }

    canvas#tetris {
      display: block;
      background-color: #050811;
    }

    /* 사이드 패널 */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 130px;
    }

    .stat-box {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 18px;
      font-weight: 800;
      color: #f1f5f9;
      font-variant-numeric: tabular-nums;
    }

    canvas#next {
      background: #0b0f19;
      border-radius: 6px;
      display: block;
      margin: 4px auto 0;
    }

    .btn-sound {
      background: #334155;
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-sound:hover {
      background: #475569;
    }

    /* 일시정지 및 오버레이 */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 25, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }

    .overlay h2 {
      font-size: 22px;
      color: #ef4444;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    }

    .overlay p {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 16px;
    }

    .btn-action {
      background: #38bdf8;
      color: #0b0f19;
      border: none;
      font-weight: 800;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
      transition: transform 0.1s;
    }

    .btn-action:active {
      transform: scale(0.96);
    }

    /* 모바일 터치 컨트롤러 */
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 8px;
      max-width: 320px;
      width: 100%;
      margin-top: 14px;
    }

    .ctrl-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      height: 52px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      touch-action: manipulation;
    }

    .ctrl-btn:active {
      background: #38bdf8;
      color: #0f172a;
      transform: translateY(2px);
    }

    .ctrl-btn.hard-drop {
      background: #0284c7;
      grid-column: span 3;
      height: 44px;
      font-size: 14px;
    }

    /* 키보드 가이드 */
    .key-guide {
      margin-top: 10px;
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.6;
    }

    .key-guide kbd {
      background: #334155;
      color: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🕹️ RETRO TETRIS</h1>
  </header>

  <div class="main-layout">
    <!-- 메인 캔버스 -->
    <div class="game-board-container">
      <canvas id="tetris" width="240" height="480"></canvas>
      
      <!-- 시작 / 게임오버 오버레이 -->
      <div id="overlay" class="overlay">
        <h2 id="overlay-title">TETRIS</h2>
        <p id="overlay-msg">사운드와 함께 즐겨보세요!</p>
        <button id="btn-start" class="btn-action">게임 시작</button>
      </div>
    </div>

    <!-- 사이드바 -->
    <div class="sidebar">
      <div class="stat-box">
        <div class="stat-label">NEXT</div>
        <canvas id="next" width="80" height="80"></canvas>
      </div>

      <div class="stat-box">
        <div class="stat-label">SCORE</div>
        <div id="score" class="stat-val">0</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">LINES</div>
        <div id="lines" class="stat-val">0</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">LEVEL</div>
        <div id="level" class="stat-val">1</div>
      </div>

      <button id="btn-sound" class="btn-sound">
        <span id="sound-icon">🔊</span> 사운드 ON
      </button>
    </div>
  </div>

  <!-- 모바일 터치 패드 -->
  <div class="controls">
    <button class="ctrl-btn" id="btn-left">◀</button>
    <button class="ctrl-btn" id="btn-rotate">↻ 회전</button>
    <button class="ctrl-btn" id="btn-right">▶</button>
    <button class="ctrl-btn" id="btn-down" style="grid-column: span 3; height: 42px;">▼ 소프트 드롭</button>
    <button class="ctrl-btn hard-drop" id="btn-drop">⚡ 즉시 낙하 (스페이스)</button>
  </div>

  <div class="key-guide">
    <kbd>←</kbd> <kbd>→</kbd> 이동 | <kbd>↑</kbd> 회전 | <kbd>↓</kbd> 가속 | <kbd>Space</kbd> 하드드롭 | <kbd>P</kbd> 일시정지
  </div>

  <script>
    // ==========================================
    // 1. Web Audio API 사운드 신시사이저 (효과음)
    // ==========================================
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.15) {
        if (!this.enabled) return;
        this.init();

        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }

      move() {
        this.playTone(320, 'triangle', 0.04, 0.08);
      }

      rotate() {
        this.playTone(480, 'sine', 0.06, 0.12);
      }

      drop() {
        this.playTone(160, 'square', 0.08, 0.15);
      }

      clear() {
        if (!this.enabled) return;
        this.init();
        // 맑은 2화음 팡파레
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          setTimeout(() => {
            this.playTone(freq, 'triangle', 0.18, 0.15);
          }, idx * 60);
        });
      }

      gameOver() {
        if (!this.enabled) return;
        this.init();
        [300, 260, 220, 180].forEach((freq, idx) => {
          setTimeout(() => {
            this.playTone(freq, 'sawtooth', 0.22, 0.15);
          }, idx * 120);
        });
      }
    }

    const sound = new SoundFX();

    // ==========================================
    // 2. 테트리스 게임 로직
    // ==========================================
    const COLS = 10;
    const ROWS = 20;
    const BLOCK_SIZE = 24;

    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextCtx = nextCanvas.getContext('2d');

    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const btnStart = document.getElementById('btn-start');

    const scoreElem = document.getElementById('score');
    const linesElem = document.getElementById('lines');
    const levelElem = document.getElementById('level');
    const btnSound = document.getElementById('btn-sound');
    const soundIcon = document.getElementById('sound-icon');

    // 블록 팔레트
    const COLORS = [
      null,
      '#00f0f0', // I (청록)
      '#0000f0', // J (파랑)
      '#f0a000', // L (주황)
      '#f0f000', // O (노랑)
      '#00f000', // S (초록)
      '#a000f0', // T (보라)
      '#f00000'  // Z (빨강)
    ];

    const PIECES = 'IJLOSTZ';

    function createPiece(type) {
      switch (type) {
        case 'I':
          return [
            [0, 1, 0, 0],
            [0, 1, 0, 0],
            [0, 1, 0, 0],
            [0, 1, 0, 0],
          ];
        case 'J':
          return [
            [0, 2, 0],
            [0, 2, 0],
            [2, 2, 0],
          ];
        case 'L':
          return [
            [0, 3, 0],
            [0, 3, 0],
            [0, 3, 3],
          ];
        case 'O':
          return [
            [4, 4],
            [4, 4],
          ];
        case 'S':
          return [
            [0, 5, 5],
            [5, 5, 0],
            [0, 0, 0],
          ];
        case 'T':
          return [
            [0, 6, 0],
            [6, 6, 6],
            [0, 0, 0],
          ];
        case 'Z':
          return [
            [7, 7, 0],
            [0, 7, 7],
            [0, 0, 0],
          ];
      }
    }

    let board = createMatrix(COLS, ROWS);
    let player = {
      pos: { x: 0, y: 0 },
      matrix: null,
      nextMatrix: null,
      score: 0,
      lines: 0,
      level: 1
    };

    let dropCounter = 0;
    let dropInterval = 800;
    let lastTime = 0;
    let isGameOver = false;
    let isPaused = false;
    let isRunning = false;

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    function collide(board, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
              (board[y + o.y] &&
               board[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(board, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            board[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    function playerRotate(dir) {
      if (!isRunning || isPaused || isGameOver) return;
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(board, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
      sound.rotate();
      draw();
    }

    function playerMove(dir) {
      if (!isRunning || isPaused || isGameOver) return;
      player.pos.x += dir;
      if (collide(board, player)) {
        player.pos.x -= dir;
      } else {
        sound.move();
      }
      draw();
    }

    function playerDrop() {
      if (!isRunning || isPaused || isGameOver) return;
      player.pos.y++;
      if (collide(board, player)) {
        player.pos.y--;
        merge(board, player);
        sound.drop();
        playerReset();
        arenaSweep();
        updateScore();
      }
      dropCounter = 0;
      draw();
    }

    function playerHardDrop() {
      if (!isRunning || isPaused || isGameOver) return;
      while (!collide(board, player)) {
        player.pos.y++;
      }
      player.pos.y--;
      merge(board, player);
      sound.drop();
      playerReset();
      arenaSweep();
      updateScore();
      dropCounter = 0;
      draw();
    }

    function getRandomPiece() {
      return createPiece(PIECES[Math.floor(Math.random() * PIECES.length)]);
    }

    function playerReset() {
      if (!player.nextMatrix) {
        player.nextMatrix = getRandomPiece();
      }
      player.matrix = player.nextMatrix;
      player.nextMatrix = getRandomPiece();

      player.pos.y = 0;
      player.pos.x = Math.floor(COLS / 2) - Math.floor(player.matrix[0].length / 2);

      drawNext();

      if (collide(board, player)) {
        isGameOver = true;
        isRunning = false;
        sound.gameOver();
        overlayTitle.innerText = "GAME OVER";
        overlayMsg.innerText = `최종 점수: ${player.score}점`;
        btnStart.innerText = "다시 플레이";
        overlay.style.display = 'flex';
      }
    }

    function arenaSweep() {
      let rowCount = 0;
      outer: for (let y = board.length - 1; y >= 0; --y) {
        for (let x = 0; x < board[y].length; ++x) {
          if (board[y][x] === 0) {
            continue outer;
          }
        }
        const row = board.splice(y, 1)[0].fill(0);
        board.unshift(row);
        ++y;
        rowCount++;
      }

      if (rowCount > 0) {
        const lineScores = [0, 100, 300, 500, 800];
        player.score += (lineScores[rowCount] || 1000) * player.level;
        player.lines += rowCount;
        player.level = Math.floor(player.lines / 10) + 1;
        dropInterval = Math.max(120, 800 - (player.level - 1) * 70);
        sound.clear();
      }
    }

    function updateScore() {
      scoreElem.innerText = player.score.toLocaleString();
      linesElem.innerText = player.lines;
      levelElem.innerText = player.level;
    }

    // 렌더링
    function drawBlock(ctx, x, y, val) {
      const color = COLORS[val];
      ctx.fillStyle = color;
      ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);

      // 블록 입체 광원 효과
      ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
      ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, 3);
      ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, 3, BLOCK_SIZE);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.fillRect(x * BLOCK_SIZE, (y + 1) * BLOCK_SIZE - 3, BLOCK_SIZE, 3);
      ctx.fillRect((x + 1) * BLOCK_SIZE - 3, y * BLOCK_SIZE, 3, BLOCK_SIZE);
    }

    function draw() {
      // 캔버스 초기화
      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 그리드 라인 표시
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 1;
      for (let x = 0; x < COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * BLOCK_SIZE, 0);
        ctx.lineTo(x * BLOCK_SIZE, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * BLOCK_SIZE);
        ctx.lineTo(canvas.width, y * BLOCK_SIZE);
        ctx.stroke();
      }

      // 보드 블록 그리기
      board.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            drawBlock(ctx, x, y, value);
          }
        });
      });

      // 현재 낙하 중인 블록 그리기
      if (player.matrix) {
        player.matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value !== 0) {
              drawBlock(ctx, x + player.pos.x, y + player.pos.y, value);
            }
          });
        });
      }
    }

    function drawNext() {
      nextCtx.fillStyle = '#0b0f19';
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

      if (!player.nextMatrix) return;

      const size = 18;
      const offsetX = (nextCanvas.width - player.nextMatrix[0].length * size) / 2;
      const offsetY = (nextCanvas.height - player.nextMatrix.length * size) / 2;

      player.nextMatrix.forEach((row, y) => {
        row.forEach((val, x) => {
          if (val !== 0) {
            nextCtx.fillStyle = COLORS[val];
            nextCtx.fillRect(offsetX + x * size, offsetY + y * size, size, size);

            nextCtx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            nextCtx.fillRect(offsetX + x * size, offsetY + y * size, size, 2);
            nextCtx.fillRect(offsetX + x * size, offsetY + y * size, 2, size);
          }
        });
      });
    }

    function update(time = 0) {
      if (!isRunning || isPaused || isGameOver) return;

      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    function startGame() {
      sound.init();
      board = createMatrix(COLS, ROWS);
      player.score = 0;
      player.lines = 0;
      player.level = 1;
      dropInterval = 800;
      isGameOver = false;
      isPaused = false;
      isRunning = true;
      updateScore();
      player.nextMatrix = null;
      playerReset();
      overlay.style.display = 'none';
      lastTime = performance.now();
      requestAnimationFrame(update);
    }

    // ==========================================
    // 3. 이벤트 바인딩 (키보드 & 버튼)
    // ==========================================
    btnStart.addEventListener('click', () => {
      startGame();
    });

    // 사운드 토글
    btnSound.addEventListener('click', () => {
      sound.enabled = !sound.enabled;
      if (sound.enabled) {
        sound.init();
        soundIcon.innerText = "🔊";
        btnSound.innerHTML = `<span>🔊</span> 사운드 ON`;
      } else {
        soundIcon.innerText = "🔇";
        btnSound.innerHTML = `<span>🔇</span> 사운드 OFF`;
      }
    });

    // 키보드 조작
    window.addEventListener('keydown', event => {
      if (event.code === 'KeyP') {
        if (!isRunning || isGameOver) return;
        isPaused = !isPaused;
        if (!isPaused) {
          lastTime = performance.now();
          requestAnimationFrame(update);
          overlay.style.display = 'none';
        } else {
          overlayTitle.innerText = "PAUSE";
          overlayMsg.innerText = "게임이 일시 정지되었습니다.";
          btnStart.innerText = "계속하기";
          overlay.style.display = 'flex';
        }
        return;
      }

      switch (event.code) {
        case 'ArrowLeft':
          event.preventDefault();
          playerMove(-1);
          break;
        case 'ArrowRight':
          event.preventDefault();
          playerMove(1);
          break;
        case 'ArrowDown':
          event.preventDefault();
          playerDrop();
          break;
        case 'ArrowUp':
          event.preventDefault();
          playerRotate(1);
          break;
        case 'Space':
          event.preventDefault();
          playerHardDrop();
          break;
      }
    });

    // 모바일 터치 버튼 조작
    document.getElementById('btn-left').addEventListener('click', () => playerMove(-1));
    document.getElementById('btn-right').addEventListener('click', () => playerMove(1));
    document.getElementById('btn-rotate').addEventListener('click', () => playerRotate(1));
    document.getElementById('btn-down').addEventListener('click', () => playerDrop());
    document.getElementById('btn-drop').addEventListener('click', () => playerHardDrop());

    // 초기 화면 그리기
    draw();
  </script>
</body>
</html>
