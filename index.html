<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exodus Lab - 게임 & 스토리 포털 허브</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --panel-bg: rgba(22, 28, 45, 0.75);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-hover: rgba(51, 65, 85, 0.9);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.4);
      --accent: #a855f7;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: rgba(148, 163, 184, 0.15);
      --border-active: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 20% 20%, #172554 0%, #090d16 60%, #030712 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* 상단 헤더 */
    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 0 16px var(--primary-glow);
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-sub);
    }

    /* 🌟 상단 내비게이션 메뉴 (Game / Story / 추후 확장 가능) */
    .nav-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .nav-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 13.5px;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .nav-tab-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-tab-btn.active {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #fff;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
    }

    .nav-tab-btn .badge-count {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.2);
      padding: 1px 6px;
      border-radius: 10px;
    }

    .header-link {
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.2s;
    }

    .header-link:hover {
      background: var(--primary);
      color: #090d16;
    }

    /* 메인 2열 레이아웃 */
    .container {
      flex: 1;
      display: flex;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      gap: 24px;
    }

    /* 좌측 사이드바 */
    .sidebar {
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .sidebar-header {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 0 6px 4px;
      display: flex;
      justify-content: space-between;
    }

    .content-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .content-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s ease;
      position: relative;
    }

    .content-item:hover {
      background: var(--card-hover);
      transform: translateX(4px);
    }

    .content-item.active {
      background: rgba(37, 99, 235, 0.2);
      border-color: var(--border-active);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.2);
    }

    .content-icon {
      font-size: 28px;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .content-info {
      flex: 1;
      overflow: hidden;
    }

    .content-title {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .content-tag {
      font-size: 11px;
      color: var(--primary);
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      display: inline-block;
    }

    /* 우측 상세 정보 & 미리보기 패널 */
    .detail-panel {
      flex: 1;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      backdrop-filter: blur(16px);
      min-width: 0;
    }

    .detail-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    .detail-header-left {
      max-width: 650px;
    }

    .detail-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid var(--accent);
      color: #e9d5ff;
      margin-bottom: 8px;
    }

    .detail-title {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .detail-desc {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.6;
    }

    .btn-launch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
      transition: all 0.2s;
      white-space: nowrap;
      cursor: pointer;
      border: none;
    }

    .btn-launch:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
      background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%);
    }

    /* 프리뷰 창 (iframe) */
    .preview-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      min-height: 500px;
      position: relative;
    }

    .preview-bar {
      background: #0f172a;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 12px;
      color: var(--text-sub);
    }

    .dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-r { background: #ef4444; }
    .dot-y { background: #eab308; }
    .dot-g { background: #22c55e; }

    iframe#preview-frame {
      width: 100%;
      flex: 1;
      border: none;
      background: #0b0f19;
    }

    /* 모바일 반응형 */
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
        padding: 14px;
      }
      .sidebar {
        width: 100%;
      }
      .detail-panel {
        padding: 18px;
      }
      .preview-box {
        min-height: 400px;
      }
      header {
        flex-direction: column;
        align-items: stretch;
      }
      .header-left {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
      .nav-tabs {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 헤더 & 메뉴 탭 -->
  <header>
    <div class="header-left">
      <div class="brand">
        <div class="brand-logo">E</div>
        <div>
          <div class="brand-title">Exodus Creative Hub</div>

        </div>
      </div>

      <nav class="nav-tabs">
        <button class="nav-tab-btn active" data-category="game">
          🎮 Game <span class="badge-count" id="count-game">6</span>

    <a href="https://github.com/exodusbiz1004/exodus-test" target="_blank" rel="noopener noreferrer" class="header-link">

  <div class="container">

    <!-- 우측 상세 정보 & 라이브 샘플 화면 -->
    <main class="detail-panel">

      <!-- 실시간 라이브 미리보기 (iframe) -->
      <div class="preview-box">
        <div class="preview-bar">
          <div class="dots">
            <span class="dot dot-r"></span>
            <span class="dot dot-y"></span>
            <span class="dot dot-g"></span>
          </div>
          <span id="preview-url-label">샘플 미리보기 화면 (직접 터치/조작 가능)</span>
          <span>LIVE PREVIEW</span>
        </div>
        <iframe id="preview-frame" src="" title="Content Preview"></iframe>
      </div>
    </main>
  </div>

      {

        file: 'game/Game02.html',

    let currentCategory = 'game';
    let currentIndex = 0;

    const contentListElem = document.getElementById('content-list');
    const categoryTitle = document.getElementById('category-title');
    const viewTitle = document.getElementById('view-title');
    const viewTag = document.getElementById('view-tag');
    const viewDesc = document.getElementById('view-desc');
    const btnRun = document.getElementById('btn-run');
    const previewFrame = document.getElementById('preview-frame');
    const previewUrlLabel = document.getElementById('preview-url-label');

    // 개수 배지 업데이트
    document.getElementById('count-game').innerText = CONTENTS.filter(c => c.category === 'game').length;
    document.getElementById('count-story').innerText = CONTENTS.filter(c => c.category === 'story').length;

    // 카테고리별 리스트 렌더링
    function renderList() {
      contentListElem.innerHTML = '';
      const filtered = CONTENTS.filter(c => c.category === currentCategory);

      categoryTitle.innerText = currentCategory === 'game' 
        ? `플레이 가능한 게임 (${filtered.length})` 
        : `함께 읽는 동화 이야기 (${filtered.length})`;

      filtered.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `content-item ${index === currentIndex ? 'active' : ''}`;
        div.innerHTML = `
          <div class="content-icon">${item.icon}</div>
          <div class="content-info">
            <div class="content-title">${item.title}</div>
            <span class="content-tag">${item.tag}</span>
          </div>
        `;
        div.addEventListener('click', () => selectItem(index));
        contentListElem.appendChild(div);
      });

      if (filtered.length > 0) {
        selectItem(Math.min(currentIndex, filtered.length - 1));
      }
    }

    // 아이템 선택 처리
    function selectItem(index) {
      currentIndex = index;
      const filtered = CONTENTS.filter(c => c.category === currentCategory);
      const item = filtered[index];
      if (!item) return;

      document.querySelectorAll('.content-item').forEach((el, idx) => {
        el.classList.toggle('active', idx === index);
      });

      viewTitle.innerText = `${item.icon} ${item.title}`;
      viewTag.innerText = item.tag;
      viewDesc.innerText = item.desc;

      const encodedFile = encodeURI(item.file);
      previewFrame.src = encodedFile;
      previewUrlLabel.innerText = `샘플 미리보기: ${item.file}`;

      btnRun.innerText = currentCategory === 'game' ? '🚀 새창에서 게임 실행' : '📖 새창에서 동화 읽기';
      btnRun.onclick = () => {
        window.open(encodedFile, '_blank');
      };
    }

    // 상단 탭 클릭 이벤트 (Game / Story 전환)
    document.querySelectorAll('.nav-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        currentIndex = 0;
        renderList();
      });
    });

    // 초기화
    renderList();
  </script>
</body>
</html>
