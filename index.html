<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exodus Lab - 미니게임 & 테스트 프로젝트 허브</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --panel-bg: rgba(22, 28, 45, 0.75);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-hover: rgba(51, 65, 85, 0.9);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.4);
      --accent: #a855f7;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: rgba(148, 163, 184, 0.15);
      --border-active: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 20% 20%, #172554 0%, #090d16 60%, #030712 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* 헤더 */
    header {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 0 16px var(--primary-glow);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-sub);
    }

    .header-link {
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.2s;
    }

    .header-link:hover {
      background: var(--primary);
      color: #090d16;
    }

    /* 레이아웃 (좌: 목록, 우: 상세 및 미리보기) */
    .container {
      flex: 1;
      display: flex;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      gap: 24px;
    }

    /* 좌측 사이드바: 게임 리스트 */
    .sidebar {
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .sidebar-header {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 0 6px 4px;
      display: flex;
      justify-content: space-between;
    }

    .game-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .game-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s ease;
      position: relative;
    }

    .game-item:hover {
      background: var(--card-hover);
      transform: translateX(4px);
    }

    .game-item.active {
      background: rgba(37, 99, 235, 0.2);
      border-color: var(--border-active);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.2);
    }

    .game-icon {
      font-size: 28px;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .game-info {
      flex: 1;
      overflow: hidden;
    }

    .game-title {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .game-tag {
      font-size: 11px;
      color: var(--primary);
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      display: inline-block;
    }

    /* 우측: 상세 정보 및 인터랙티브 샘플 프리뷰 */
    .detail-panel {
      flex: 1;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      backdrop-filter: blur(16px);
      min-width: 0;
    }

    .detail-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    .detail-header-left {
      max-width: 650px;
    }

    .detail-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid var(--accent);
      color: #e9d5ff;
      margin-bottom: 8px;
    }

    .detail-title {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .detail-desc {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.6;
    }

    .btn-launch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
      transition: all 0.2s;
      white-space: nowrap;
      cursor: pointer;
      border: none;
    }

    .btn-launch:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
      background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%);
    }

    /* 프리뷰 창 (iframe 샘플 화면) */
    .preview-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      min-height: 480px;
      position: relative;
    }

    .preview-bar {
      background: #0f172a;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 12px;
      color: var(--text-sub);
    }

    .dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-r { background: #ef4444; }
    .dot-y { background: #eab308; }
    .dot-g { background: #22c55e; }

    iframe#preview-frame {
      width: 100%;
      flex: 1;
      border: none;
      background: #0b0f19;
    }

    /* 모바일 반응형 */
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
        padding: 14px;
      }
      .sidebar {
        width: 100%;
      }
      .detail-panel {
        padding: 18px;
      }
      .preview-box {
        min-height: 380px;
      }
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header>
    <div class="brand">
      <div class="brand-logo">E</div>
      <div>
        <div class="brand-title">Exodus Test Lab</div>
        <div class="brand-sub">프로젝트 & 미니게임 모음 포털</div>
      </div>
    </div>
    <a href="https://github.com/exodusbiz1004/exodus-test" target="_blank" rel="noopener noreferrer" class="header-link">
      GitHub Repository ↗
    </a>
  </header>

  <div class="container">
    <!-- 좌측 목록 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>플레이 가능한 게임 (5)</span>
        <span>TEST PROJECTS</span>
      </div>
      <div class="game-list" id="game-list">
        <!-- JS로 동적 생성 -->
      </div>
    </aside>

    <!-- 우측 상세 정보 & 샘플 화면 -->
    <main class="detail-panel">
      <div class="detail-top">
        <div class="detail-header-left">
          <div class="detail-badge" id="view-tag">장르</div>
          <h2 class="detail-title" id="view-title">게임 제목</h2>
          <p class="detail-desc" id="view-desc">게임 설명이 들어갑니다.</p>
        </div>
        <button id="btn-run" class="btn-launch">
          🚀 새창에서 게임 실행
        </button>
      </div>

      <!-- 실시간 라이브 샘플 화면 -->
      <div class="preview-box">
        <div class="preview-bar">
          <div class="dots">
            <span class="dot dot-r"></span>
            <span class="dot dot-y"></span>
            <span class="dot dot-g"></span>
          </div>
          <span id="preview-url-label">샘플 미리보기 화면 (직접 터치/클릭 가능)</span>
          <span>LIVE PREVIEW</span>
        </div>
        <iframe id="preview-frame" src="" title="Game Preview"></iframe>
      </div>
    </main>
  </div>

  <script>
    // 5가지 게임 데이터 정의
    const GAMES = [
      {
        id: 'tetris',
        title: '레트로 아케이드 테트리스',
        file: 'tetris.html',
        tag: '아케이드 · 효과음 탑재',
        icon: '🕹️',
        desc: 'Web Audio API 사운드 신시사이저가 탑재된 정통 테트리스 게임입니다. 회전, 하드드롭, 라인 클리어 효과음과 함께 모바일 터치 패드 및 키보드 조작을 지원합니다.'
      },
      {
        id: 'game01',
        title: '코스믹 스네이크 (Cosmic Snake)',
        file: 'Game01.html',
        tag: '스페이스 · 액션',
        icon: '🌌',
        desc: '우주를 배경으로 별빛 에너지를 흡수하며 성장하는 환상적인 비주얼의 스네이크 게임입니다. 반응형 컨트롤과 화려한 네온 그라디언트 그래픽이 돋보입니다.'
      },
      {
        id: 'game02',
        title: '클래식 지렁이 게임 (Snake Game)',
        file: 'Game02.html',
        tag: '클래식 · 캐주얼',
        icon: '🐍',
        desc: '언제 즐겨도 재미있는 전통적인 지렁이 아케이드 게임입니다. 사과를 먹고 점점 길어지는 지렁이를 조작하여 최고 점수를 달성해 보세요!'
      },
      {
        id: 'random-play',
        title: '오늘 뭐 하고 놀까? 랜덤 플레이',
        file: '오늘 뭐 하고 놀까_ _ 랜덤 플레이.html',
        tag: '인터랙티브 · 룰렛',
        icon: '🎲',
        desc: '무엇을 할지 고민될 때 유쾌한 영감을 주는 인터랙티브 룰렛 & 랜덤 결정 게임입니다. 친구들과 함께 벌칙이나 놀거리를 정할 때 안성맞춤입니다.'
      },
      {
        id: 'nonsense-island',
        title: '넌센스 과일섬 · 웃음이 열리는 모험',
        file: '넌센스 과일섬 · 웃음이 열리는 모험.html',
        tag: '퀴즈 · 퍼즐 어드벤처',
        icon: '🏝️',
        desc: '알쏭달쏭 재미있는 넌센스 퀴즈를 풀며 과일섬을 탐험하는 스토리형 퀴즈 어드벤처 게임입니다. 남녀노소 누구나 웃으며 즐길 수 있습니다.'
      }
    ];

    let currentIndex = 0;

    const gameListElem = document.getElementById('game-list');
    const viewTitle = document.getElementById('view-title');
    const viewTag = document.getElementById('view-tag');
    const viewDesc = document.getElementById('view-desc');
    const btnRun = document.getElementById('btn-run');
    const previewFrame = document.getElementById('preview-frame');
    const previewUrlLabel = document.getElementById('preview-url-label');

    // 리스트 렌더링
    function renderList() {
      gameListElem.innerHTML = '';
      GAMES.forEach((game, index) => {
        const item = document.createElement('div');
        item.className = `game-item ${index === currentIndex ? 'active' : ''}`;
        item.innerHTML = `
          <div class="game-icon">${game.icon}</div>
          <div class="game-info">
            <div class="game-title">${game.title}</div>
            <span class="game-tag">${game.tag}</span>
          </div>
        `;
        item.addEventListener('click', () => selectGame(index));
        gameListElem.appendChild(item);
      });
    }

    // 게임 선택 처리
    function selectGame(index) {
      currentIndex = index;
      const game = GAMES[index];

      // 활성화 클래스 갱신
      document.querySelectorAll('.game-item').forEach((el, idx) => {
        el.classList.toggle('active', idx === index);
      });

      // 상세 영역 갱신
      viewTitle.innerText = `${game.icon} ${game.title}`;
      viewTag.innerText = game.tag;
      viewDesc.innerText = game.desc;

      // 파일 경로 인코딩 처리
      const encodedFile = encodeURI(game.file);
      previewFrame.src = encodedFile;
      previewUrlLabel.innerText = `샘플 화면: ${game.file}`;

      // 새창 실행 버튼 바인딩
      btnRun.onclick = () => {
        window.open(encodedFile, '_blank');
      };
    }

    // 초기화
    renderList();
    selectGame(0);
  </script>
</body>
</html>
