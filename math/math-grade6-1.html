<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초등 6학년 1학기 수학 마스터 - 스마트 인터랙티브 스터디룸</title>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #0f172a;
      --sidebar-bg: #1e293b;
      --card-bg: #1e293b;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #0f172a 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* 상단 헤더 */
    header {
      width: 100%;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      font-size: 26px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }
    .brand-title { font-size: 19px; font-weight: 900; background: linear-gradient(135deg, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-sub { font-size: 12px; color: var(--text-dim); }

    .header-links {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-portal {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-portal:hover { background: rgba(255, 255, 255, 0.16); transform: translateY(-1px); }

    /* 메인 2열 레이아웃 */
    .math-wrapper {
      flex: 1;
      display: flex;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      gap: 24px;
    }

    /* 좌측 단원 사이드바 */
    .sidebar {
      width: 320px;
      flex-shrink: 0;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px 16px;
      height: fit-content;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      position: sticky;
      top: 90px;
    }
    .sidebar-header {
      padding: 0 8px 14px 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .sidebar-title { font-size: 16px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 8px; }
    .sidebar-desc { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

    .unit-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .unit-btn {
      width: 100%;
      text-align: left;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      color: var(--text-dim);
      font-size: 14.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .unit-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(96, 165, 250, 0.4);
      transform: translateX(4px);
    }
    .unit-btn.active {
      color: #fff;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.35), rgba(139, 92, 246, 0.35));
      border-color: #3b82f6;
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.35);
    }
    .unit-badge {
      background: rgba(255, 255, 255, 0.12);
      color: #60a5fa;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 8px;
      font-weight: 900;
    }
    .unit-btn.active .unit-badge { background: #3b82f6; color: #fff; }

    /* 단원 완료 체크 배지 */
    .unit-check-badge {
      margin-left: auto;
      font-size: 14px;
    }

    /* 우측 상세 콘텐츠 영역 */
    .content-panel {
      flex: 1;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 30px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
      line-height: 1.8;
    }

    .unit-hero {
      border-bottom: 2px dashed var(--border);
      padding-bottom: 20px;
      margin-bottom: 24px;
    }
    .unit-tag {
      display: inline-block;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      font-size: 12.5px;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .unit-heading {
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .unit-summary {
      font-size: 15.5px;
      color: var(--text-dim);
    }

    /* 학습 모드 3단 탭 */
    .study-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 26px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .study-tab-btn {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .study-tab-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .study-tab-btn.active {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      border-color: #60a5fa;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 섹션 타이틀 */
    .section-title {
      font-size: 20px;
      font-weight: 900;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 28px 0 16px 0;
    }

    /* 개념 정리 박스 */
    .concept-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 20px 22px;
      margin-bottom: 18px;
    }
    .concept-card-title {
      font-size: 17px;
      font-weight: 800;
      color: #facc15;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .concept-body {
      font-size: 15.5px;
      color: #e2e8f0;
      word-break: keep-all;
    }
    .concept-body ul { margin-left: 20px; margin-top: 8px; }
    .concept-body li { margin-bottom: 6px; }

    .formula-box {
      background: #090d16;
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 12px;
      padding: 12px 18px;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      font-weight: 800;
      color: #93c5fd;
      margin: 10px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 시각화 실험실 (Lab) */
    .lab-box {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
      border: 2px solid #3b82f6;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .lab-title {
      font-size: 18px;
      font-weight: 900;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .lab-desc {
      font-size: 14.5px;
      color: var(--text-dim);
      margin-bottom: 18px;
    }
    .lab-control-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      background: rgba(15, 23, 42, 0.6);
      padding: 12px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .lab-input {
      background: #090d16;
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      width: 90px;
      text-align: center;
    }
    .lab-btn {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border: none;
      color: #fff;
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lab-btn:hover { transform: translateY(-1px); }
    .lab-result-display {
      background: #090d16;
      border: 1px dashed #60a5fa;
      border-radius: 14px;
      padding: 18px;
      font-size: 16px;
      font-weight: 800;
      color: #fde047;
      line-height: 1.8;
    }

    /* 족집게 포인트 */
    .point-box {
      background: linear-gradient(135deg, rgba(234, 88, 12, 0.15), rgba(245, 158, 11, 0.15));
      border: 2px solid #f97316;
      border-radius: 18px;
      padding: 20px 22px;
      margin: 24px 0;
    }
    .point-box-title {
      font-size: 16.5px;
      font-weight: 900;
      color: #fb923c;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .point-list {
      list-style: none;
      padding: 0;
    }
    .point-list li {
      position: relative;
      padding-left: 22px;
      font-size: 15px;
      color: #ffedd5;
      margin-bottom: 8px;
      line-height: 1.6;
    }
    .point-list li::before {
      content: '★';
      position: absolute;
      left: 0;
      color: #f97316;
      font-weight: 900;
    }

    /* 실전 퀴즈 테스트 카드 */
    .quiz-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
    }
    .quiz-q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .quiz-badge {
      background: #10b981;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 10px;
    }
    .quiz-status-pill {
      font-size: 13px;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 10px;
    }
    .quiz-status-pill.unsolved { background: rgba(255,255,255,0.1); color: var(--text-dim); }
    .quiz-status-pill.correct { background: #10b981; color: #fff; }
    .quiz-status-pill.wrong { background: #ef4444; color: #fff; }

    .quiz-q-text {
      font-size: 16.5px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 14px;
      line-height: 1.6;
    }

    .quiz-input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .quiz-user-input {
      flex: 1;
      background: #090d16;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      padding: 10px 16px;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      outline: none;
    }
    .quiz-user-input:focus { border-color: #3b82f6; }
    .btn-quiz-check {
      background: #3b82f6;
      border: none;
      color: #fff;
      padding: 0 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-quiz-check:hover { background: #2563eb; }

    .quiz-feedback {
      display: none;
      background: #090d16;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14.5px;
      line-height: 1.7;
    }
    .quiz-feedback.show { display: block; }
    .quiz-feedback.correct { border: 1px solid #10b981; color: #a7f3d0; }
    .quiz-feedback.wrong { border: 1px solid #ef4444; color: #fca5a5; }

    @media (max-width: 900px) {
      .math-wrapper { flex-direction: column; }
      .sidebar { width: 100%; position: static; }
      .content-panel { padding: 20px; }
      .unit-heading { font-size: 24px; }
    }
  </style>
</head>
<body>

  <!-- 상단 공통 네비게이션 헤더 -->
  <header>
    <div class="brand">
      <div class="brand-icon">📐</div>
      <div>
        <div class="brand-title">초등 6학년 1학기 수학 마스터</div>
        <div class="brand-sub">개념정리 · 인터랙티브 계산 실험실 · 단원별 실전 퀴즈 & 자가채점</div>
      </div>
    </div>
    <div class="header-links">
      <a href="math-grade6-2.html" class="btn-portal" style="background:rgba(139,92,246,0.2); border-color:#8b5cf6;">
        ▶ 6학년 2학기 보러가기
      </a>
      <a href="../index.html" class="btn-portal">
        🏠 메인 포털 허브
      </a>
    </div>
  </header>

  <!-- 2열 메인 레이아웃 -->
  <div class="math-wrapper">
    <!-- 좌측 단원 사이드바 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">📚 6학년 1학기 단원 목록</div>
        <div class="sidebar-desc">단원을 클릭하고 실전 문제에 도전하세요!</div>
      </div>
      <nav class="unit-list" id="unit-nav">
        <!-- JS 동적 생성 -->
      </nav>
    </aside>

    <!-- 우측 상세 콘텐츠 패널 -->
    <main class="content-panel" id="content-display">
      <!-- JS로 선택된 단원 상세 동적 렌더링 -->
    </main>
  </div>

  <script>
    /* ========================================================
       초등학교 6학년 1학기 수학 6대 단원 업그레이드 데이터베이스
       - 핵심 개념 공식
       - 인터랙티브 시각화 실험실 (Lab)
       - 시험 족집게 포인트
       - 실전 자가 채점 퀴즈 (Interactive Quiz with Answer Check)
       ======================================================== */
    const MATH_UNITS_6_1_ENHANCED = [
      {
        id: 'unit1',
        num: '1단원',
        title: '분수의 나눗셈',
        icon: '➗',
        summary: '(자연수)÷(자연수), (분수)÷(자연수)의 몫을 분수로 나타내고 역수의 곱셈 원리를 완벽하게 이해합니다.',
        lab: {
          title: '🍰 [실험실] 분수 ÷ 자연수 실시간 배분 계산기',
          desc: '피자 조각(분수)을 여러 명이서 똑같이 나눌 때 1인당 몫을 계산해 보세요.',
          type: 'frac-nat-div'
        },
        concepts: [
          {
            title: '1. (자연수) ÷ (자연수)의 몫을 분수로 나타내기',
            desc: '나누어지는 수는 분자, 나누는 수는 분모가 됩니다.',
            formula: '▲ ÷ ■ = ▲ / ■   (예: 3 ÷ 4 = 3/4, 7 ÷ 5 = 7/5 = 1과 2/5)'
          },
          {
            title: '2. (분수) ÷ (자연수) 계산 원리 (분자 나누기)',
            desc: '분자가 자연수의 배수일 때는 분자를 자연수로 직접 나눕니다.',
            formula: '(6/7) ÷ 2 = (6 ÷ 2) / 7 = 3/7'
          },
          {
            title: '3. (분수) ÷ (자연수)를 곱셈으로 바꾸어 계산하기',
            desc: '나누는 자연수를 분수 (1 / 자연수)로 바꾸어 곱셈으로 계산합니다.',
            formula: '(분수) ÷ (자연수) = (분수) × (1 / 자연수)   (예: 3/5 ÷ 4 = 3/5 × 1/4 = 3/20)'
          },
          {
            title: '4. 대분수 ÷ 자연수의 계산 방법',
            desc: '대분수를 먼저 **가분수**로 고친 뒤, 역수의 곱셈으로 바꾸어 약분하여 계산합니다.',
            formula: '2와 1/3 ÷ 5 = 7/3 ÷ 5 = 7/3 × 1/5 = 7/15'
          }
        ],
        points: [
          '대분수는 무조건 가분수로 먼저 바꾼 뒤 계산해야 실수를 방지할 수 있습니다.',
          '나눗셈 기호(÷) 뒤의 자연수가 분모로 내려가는 곱셈 변환(× 1/자연수)을 숙달하세요.',
          '계산 중간에 분자와 분모를 미리 약분하면 큰 수 계산 실수를 획기적으로 줄일 수 있습니다.',
          '최종 정답이 가분수인 경우 대분수로 고쳐 쓰는 습관을 들이세요.'
        ],
        quizzes: [
          {
            q: '피자 5판을 6명이 똑같이 나누어 먹으려고 합니다. 한 사람이 먹을 수 있는 피자는 몇 판인지 분수로 쓰세요.',
            answers: ['5/6', '5/6판'],
            sol: '(자연수) ÷ (자연수) = (분자)/(분모) 공식에 따라 5 ÷ 6 = 5/6 (판) 입니다.'
          },
          {
            q: '길이가 4와 2/3 m인 리본을 7도막으로 똑같이 자르려고 합니다. 한 도막의 길이는 몇 m일까요? (기약분수로 쓰세요)',
            answers: ['2/3', '2/3m'],
            sol: '4와 2/3 = 14/3 입니다. (14/3) ÷ 7 = 14/3 × 1/7 = 2/3 m 입니다.'
          }
        ]
      },
      {
        id: 'unit2',
        num: '2단원',
        title: '각기둥과 각뿔',
        icon: '🏛️',
        summary: '입체도형의 대표적인 각기둥과 각뿔의 밑면, 옆면, 꼭짓점, 모서리, 높이의 특징과 전개도를 탐구합니다.',
        lab: {
          title: '📐 [실험실] n각기둥 & n각뿔 구성요소 자동 계산기',
          desc: '밑면의 변의 수(n)를 입력하면 꼭짓점, 면, 모서리의 개수를 즉시 계산합니다.',
          type: 'polyhedron-lab'
        },
        concepts: [
          {

    const quizStatusMap = {};

    function renderSidebar() {
      unitNav.innerHTML = '';
      MATH_UNITS_6_1_ENHANCED.forEach((unit, idx) => {
        const btn = document.createElement('button');
        btn.className = `unit-btn ${idx === currentUnitIndex ? 'active' : ''}`;
        
        const unitSolved = quizStatusMap[unit.id] ? Object.values(quizStatusMap[unit.id]).filter(v => v === true).length : 0;
        const totalQ = unit.quizzes.length;
        const checkIcon = unitSolved === totalQ ? '✅' : (unitSolved > 0 ? '📝' : '⚪');

        btn.innerHTML = `
          <span class="unit-badge">${unit.num}</span>
          <span>${unit.icon} ${unit.title}</span>
          <span class="unit-check-badge" title="퀴즈 진행: ${unitSolved}/${totalQ}">${checkIcon}</span>
        `;
        btn.addEventListener('click', () => {
          selectUnit(idx);
        });
        unitNav.appendChild(btn);
      });
    }

    function selectUnit(idx) {
      currentUnitIndex = idx;
      currentStudyTab = 'concepts';
      document.querySelectorAll('.unit-btn').forEach((b, i) => {
        b.classList.toggle('active', i === idx);
      });

      renderUnitDetail(MATH_UNITS_6_1_ENHANCED[idx]);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

          </ul>
        </div>
      </div>`;

      // 2. 시각화 실험실 탭 내용
      html += `<div id="tab-lab" class="tab-content ${currentStudyTab === 'lab' ? 'active' : ''}">`;
      html += `
        <div class="lab-box">
          <div class="lab-title">${unit.lab.title}</div>
          <div class="lab-desc">${unit.lab.desc}</div>
          ${renderLabWidget(unit)}
        </div>
      </div>`;

      // 3. 실전 퀴즈 & 자가 채점 탭 내용
      html += `<div id="tab-quizzes" class="tab-content ${currentStudyTab === 'quizzes' ? 'active' : ''}">`;
      html += `<div class="section-title">✍️ 개념 확인 실전 퀴즈 (자가 채점 시스템)</div>`;
      unit.quizzes.forEach((quiz, qIdx) => {
        const isSolved = quizStatusMap[unit.id] && quizStatusMap[unit.id][qIdx];
        const statusClass = isSolved ? 'correct' : 'unsolved';
        const statusText = isSolved ? '완료 (정답)' : '도전 전';

        html += `
          <div class="quiz-card" id="quiz-card-${qIdx}">
            <div class="quiz-q-header">
              <span class="quiz-badge">문제 ${qIdx + 1}</span>
              <span class="quiz-status-pill ${statusClass}" id="quiz-status-${qIdx}">${statusText}</span>
            </div>
            <div class="quiz-q-text">${quiz.q}</div>
            <div class="quiz-input-row">
              <input type="text" class="quiz-user-input" id="quiz-input-${qIdx}" placeholder="정답을 입력하세요 (예: 2/3)" autocomplete="off">
              <button class="btn-quiz-check" onclick="checkQuizAnswer(${qIdx})">정답 제출 ✔</button>
            </div>
            <div class="quiz-feedback" id="quiz-feedback-${qIdx}"></div>
          </div>
        `;
      });
      html += `</div>`;

      contentDisplay.innerHTML = html;
    }

    // 탭 전환 함수
    window.switchStudyTab = function(tabName) {
      currentStudyTab = tabName;
      document.querySelectorAll('.study-tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      const activeTabBtn = Array.from(document.querySelectorAll('.study-tab-btn')).find(b => b.getAttribute('onclick').includes(tabName));
      if (activeTabBtn) activeTabBtn.classList.add('active');

      const activeContent = document.getElementById(`tab-${tabName}`);
      if (activeContent) activeContent.classList.add('active');
    };

    // 실험실 위젯 렌더러
    function renderLabWidget(unit) {
      switch(unit.lab.type) {
        case 'frac-nat-div':
          return `
            <div class="lab-control-row">
              <span>(분수)</span>
              <input type="number" id="lab-fn-a" class="lab-input" value="14" style="width:60px;"> /
              <input type="number" id="lab-fn-b" class="lab-input" value="3" style="width:60px;">
              <span>÷ (자연수)</span>
              <input type="number" id="lab-fn-c" class="lab-input" value="7" style="width:60px;">
              <button class="lab-btn" onclick="calcFracNatLab()">나눗셈 곱셈 변환</button>
            </div>
            <div class="lab-result-display" id="lab-fn-result">
              계산 공식: (14/3) ÷ 7 = (14/3) × (1/7) = (14 × 1) / (3 × 7) = 14 / 21 = 2/3
            </div>
          `;
        case 'polyhedron-lab':
          return `
            <div class="lab-control-row">
              <span>밑면 다각형 변의 수 (n):</span>
              <input type="number" id="lab-poly-n" class="lab-input" value="6" min="3" max="20">
              <button class="lab-btn" onclick="calcPolyLab()">각기둥/각뿔 자동 분석</button>
            </div>
            <div class="lab-result-display" id="lab-poly-result">
              <b>[육각기둥]</b> 꼭짓점: 12개, 면: 8개, 모서리: 18개<br>
              <b>[육각뿔]</b> 꼭짓점: 7개, 면: 7개, 모서리: 12개
            </div>
          `;
        case 'dec-nat-div':
          return `
            <div class="lab-control-row">
              <span>(소수)</span>
              <input type="number" step="0.1" id="lab-dn-a" class="lab-input" value="1.2">
              <span>÷ (자연수)</span>
              <input type="number" id="lab-dn-b" class="lab-input" value="5">
              <button class="lab-btn" onclick="calcDecNatLab()">몫 계산하기</button>
            </div>
            <div class="lab-result-display" id="lab-dn-result">
              1.2 ÷ 5 = 1 안에 5가 0번 들어가므로 일의 자리에 0 쓰고, 1.20 ÷ 5 = <b>0.24</b>
            </div>
          `;
        case 'ratio-percent-lab':
          return `
            <div class="lab-control-row">
              <span>비교하는 양:</span>
              <input type="number" id="lab-rp-a" class="lab-input" value="17">
              <span>기준량:</span>
              <input type="number" id="lab-rp-b" class="lab-input" value="20">
              <button class="lab-btn" onclick="calcRatioPercentLab()">비율 & 백분율 변환</button>
            </div>
            <div class="lab-result-display" id="lab-rp-result">
              비 = 17 : 20 | 분수 비율 = 17/20 | 소수 비율 = 0.85 | 백분율 = <b>85%</b>
            </div>
          `;
        case 'graph-percent-lab':
          return `
            <div class="lab-control-row">
              <span>항목 수량:</span>
              <input type="number" id="lab-gp-a" class="lab-input" value="10"> 명
              <span>전체 수량:</span>
              <input type="number" id="lab-gp-b" class="lab-input" value="25"> 명
              <button class="lab-btn" onclick="calcGraphPercentLab()">백분율 점유율 계산</button>
            </div>
            <div class="lab-result-display" id="lab-gp-result">
              백분율 = (10 / 25) × 100 = <b>40%</b> (띠/원그래프에서 전체의 40% 차지)
            </div>
          `;
        case 'box-lab':
          return `
            <div class="lab-control-row">
              <span>가로:</span>
              <input type="number" id="lab-box-w" class="lab-input" value="5" style="width:60px;"> cm
              <span>세로:</span>
              <input type="number" id="lab-box-d" class="lab-input" value="4" style="width:60px;"> cm
              <span>높이:</span>
              <input type="number" id="lab-box-h" class="lab-input" value="6" style="width:60px;"> cm
              <button class="lab-btn" onclick="calcBoxLab()">겉넓이 & 부피 계산</button>
            </div>
            <div class="lab-result-display" id="lab-box-result">
              겉넓이 = (20 + 24 + 30) × 2 = <b>148 cm²</b> | 부피 = 5 × 4 × 6 = <b>120 cm³</b>
            </div>
          `;
        default:
          return `<div>실험실 준비 중</div>`;
      }
    }

    // 실험실 계산 로직들
    window.calcFracNatLab = function() {
      const a = parseInt(document.getElementById('lab-fn-a').value) || 1;
      const b = parseInt(document.getElementById('lab-fn-b').value) || 1;
      const c = parseInt(document.getElementById('lab-fn-c').value) || 1;
      
      const newNum = a;
      const newDen = b * c;
      
      // 최대공약수 약분
      function gcd(x, y) { return y === 0 ? x : gcd(y, x % y); }
      const g = gcd(newNum, newDen);
      const simpNum = newNum / g;
      const simpDen = newDen / g;

      document.getElementById('lab-fn-result').innerHTML = `
        (${a}/${b}) ÷ ${c} = (${a}/${b}) × (1/${c}) = ${newNum}/${newDen} = <b>${simpNum}/${simpDen}</b>
      `;
    };

    window.calcPolyLab = function() {
      const n = parseInt(document.getElementById('lab-poly-n').value) || 3;
      document.getElementById('lab-poly-result').innerHTML = `
        <b>[${n}각기둥]</b> 꼭짓점: ${n * 2}개, 면: ${n + 2}개, 모서리: ${n * 3}개<br>
        <b>[${n}각뿔]</b> 꼭짓점: ${n + 1}개, 면: ${n + 1}개, 모서리: ${n * 2}개
      `;
    };

    window.calcDecNatLab = function() {
      const a = parseFloat(document.getElementById('lab-dn-a').value) || 0;
      const b = parseInt(document.getElementById('lab-dn-b').value) || 1;
      const res = (a / b).toFixed(3);
      document.getElementById('lab-dn-result').innerHTML = `
        ${a} ÷ ${b} = <b>${parseFloat(res)}</b>
      `;
    };

    window.calcRatioPercentLab = function() {
      const a = parseFloat(document.getElementById('lab-rp-a').value) || 0;
      const b = parseFloat(document.getElementById('lab-rp-b').value) || 1;
      const rate = (a / b).toFixed(3);
      const pct = ((a / b) * 100).toFixed(1);
      document.getElementById('lab-rp-result').innerHTML = `
        비 = ${a} : ${b} | 분수 비율 = ${a}/${b} | 소수 비율 = ${parseFloat(rate)} | 백분율 = <b>${parseFloat(pct)}%</b>
      `;
    };

    window.calcGraphPercentLab = function() {
      const a = parseFloat(document.getElementById('lab-gp-a').value) || 0;
      const b = parseFloat(document.getElementById('lab-gp-b').value) || 1;
      const pct = ((a / b) * 100).toFixed(1);
      document.getElementById('lab-gp-result').innerHTML = `
        백분율 = (${a} / ${b}) × 100 = <b>${parseFloat(pct)}%</b>
      `;
    };

    window.calcBoxLab = function() {
      const w = parseFloat(document.getElementById('lab-box-w').value) || 0;
      const d = parseFloat(document.getElementById('lab-box-d').value) || 0;
      const h = parseFloat(document.getElementById('lab-box-h').value) || 0;
      const area = (w*d + d*h + w*h) * 2;
      const vol = w * d * h;
      document.getElementById('lab-box-result').innerHTML = `
        겉넓이 = <b>${area} cm²</b> | 부피 = <b>${vol} cm³</b> (또는 ${(vol / 1000000).toFixed(6)} m³)
      `;
    };

    // 실전 퀴즈 자가 채점 시스템
    window.checkQuizAnswer = function(qIdx) {
      const unit = MATH_UNITS_6_1_ENHANCED[currentUnitIndex];
      const quiz = unit.quizzes[qIdx];
      const inputElem = document.getElementById(`quiz-input-${qIdx}`);
      const feedbackElem = document.getElementById(`quiz-feedback-${qIdx}`);
      const statusElem = document.getElementById(`quiz-status-${qIdx}`);
      const userVal = inputElem.value.trim().replace(/\s+/g, '');

      if (!userVal) {
        alert('정답을 입력해 주세요!');
        return;
      }

      const isCorrect = quiz.answers.some(ans => ans.replace(/\s+/g, '') === userVal);

      if (!quizStatusMap[unit.id]) quizStatusMap[unit.id] = {};

      feedbackElem.classList.remove('correct', 'wrong');
      feedbackElem.classList.add('show');

      if (isCorrect) {
        quizStatusMap[unit.id][qIdx] = true;
        feedbackElem.classList.add('correct');
        feedbackElem.innerHTML = `
          🎉 <b>정답입니다! 완벽해요!</b><br>
          <div style="margin-top:6px; color:#e2e8f0;">${quiz.sol}</div>
        `;
        statusElem.className = 'quiz-status-pill correct';
        statusElem.textContent = '정답 ✔';
      } else {
        quizStatusMap[unit.id][qIdx] = false;
        feedbackElem.classList.add('wrong');
        feedbackElem.innerHTML = `
          ❌ <b>아쉽네요. 다시 한 번 풀어보세요!</b><br>
          <div style="margin-top:6px; color:#e2e8f0;"><b>풀이 힌트 :</b> ${quiz.sol}</div>
        `;
        statusElem.className = 'quiz-status-pill wrong';
        statusElem.textContent = '오답 ❌';
      }

      renderSidebar();
    };

    // 초기 실행
    renderSidebar();
    selectUnit(0);
  </script>
</body>
</html>
