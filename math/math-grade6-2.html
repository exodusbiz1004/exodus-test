<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초등 6학년 2학기 수학 마스터 - 스마트 인터랙티브 스터디룸</title>
  <style>
    :root {
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --accent: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #0f172a;
      --sidebar-bg: #1e293b;
      --card-bg: #1e293b;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 10%, #2e1065 0%, #0f172a 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* 상단 헤더 */
    header {
      width: 100%;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      font-size: 26px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
    }
    .brand-title { font-size: 19px; font-weight: 900; background: linear-gradient(135deg, #c084fc, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-sub { font-size: 12px; color: var(--text-dim); }

    .header-links {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-portal {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-portal:hover { background: rgba(255, 255, 255, 0.16); transform: translateY(-1px); }

    /* 메인 2열 레이아웃 */
    .math-wrapper {
      flex: 1;
      display: flex;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      gap: 24px;
    }

    /* 좌측 단원 사이드바 */
    .sidebar {
      width: 320px;
      flex-shrink: 0;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px 16px;
      height: fit-content;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      position: sticky;
      top: 90px;
    }
    .sidebar-header {
      padding: 0 8px 14px 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .sidebar-title { font-size: 16px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 8px; }
    .sidebar-desc { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

    .unit-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .unit-btn {
      width: 100%;
      text-align: left;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      color: var(--text-dim);
      font-size: 14.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .unit-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(192, 132, 252, 0.4);
      transform: translateX(4px);
    }
    .unit-btn.active {
      color: #fff;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.35), rgba(236, 72, 153, 0.35));
      border-color: #8b5cf6;
      box-shadow: 0 0 16px rgba(139, 92, 246, 0.35);
    }
    .unit-badge {
      background: rgba(255, 255, 255, 0.12);
      color: #c084fc;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 8px;
      font-weight: 900;
    }
    .unit-btn.active .unit-badge { background: #8b5cf6; color: #fff; }

    /* 단원 완료 체크박스 표시 */
    .unit-check-badge {
      margin-left: auto;
      font-size: 14px;
    }

    /* 우측 상세 콘텐츠 영역 */
    .content-panel {
      flex: 1;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 30px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
      line-height: 1.8;
    }

    .unit-hero {
      border-bottom: 2px dashed var(--border);
      padding-bottom: 20px;
      margin-bottom: 24px;
    }
    .unit-tag {
      display: inline-block;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: #fff;
      font-size: 12.5px;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .unit-heading {
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .unit-summary {
      font-size: 15.5px;
      color: var(--text-dim);
    }

    /* 학습 탭 네비게이션 (개념정리 / 시각화 실험실 / 실전 퀴즈 풀기) */
    .study-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 26px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .study-tab-btn {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .study-tab-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .study-tab-btn.active {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: #fff;
      border-color: #a855f7;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 섹션 타이틀 */
    .section-title {
      font-size: 20px;
      font-weight: 900;
      color: #c084fc;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 28px 0 16px 0;
    }

    /* 개념 정리 박스 */
    .concept-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 20px 22px;
      margin-bottom: 18px;
    }
    .concept-card-title {
      font-size: 17px;
      font-weight: 800;
      color: #facc15;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .concept-body {
      font-size: 15.5px;
      color: #e2e8f0;
      word-break: keep-all;
    }
    .concept-body ul { margin-left: 20px; margin-top: 8px; }
    .concept-body li { margin-bottom: 6px; }

    .formula-box {
      background: #090d16;
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 12px;
      padding: 12px 18px;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      font-weight: 800;
      color: #ddd6fe;
      margin: 10px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 시각화 인터랙티브 실험실 박스 */
    .lab-box {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
      border: 2px solid #8b5cf6;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .lab-title {
      font-size: 18px;
      font-weight: 900;
      color: #a78bfa;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .lab-desc {
      font-size: 14.5px;
      color: var(--text-dim);
      margin-bottom: 18px;
    }
    .lab-control-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      background: rgba(15, 23, 42, 0.6);
      padding: 12px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .lab-input {
      background: #090d16;
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      width: 90px;
      text-align: center;
    }
    .lab-btn {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border: none;
      color: #fff;
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lab-btn:hover { transform: translateY(-1px); }
    .lab-result-display {
      background: #090d16;
      border: 1px dashed #a855f7;
      border-radius: 14px;
      padding: 18px;
      font-size: 16px;
      font-weight: 800;
      color: #fde047;
      line-height: 1.8;
    }

    /* 족집게 핵심 포인트 박스 */
    .point-box {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.15), rgba(139, 92, 246, 0.15));
      border: 2px solid #ec4899;
      border-radius: 18px;
      padding: 20px 22px;
      margin: 24px 0;
    }
    .point-box-title {
      font-size: 16.5px;
      font-weight: 900;
      color: #f472b6;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .point-list {
      list-style: none;
      padding: 0;
    }
    .point-list li {
      position: relative;
      padding-left: 22px;
      font-size: 15px;
      color: #fce7f3;
      margin-bottom: 8px;
      line-height: 1.6;
    }
    .point-list li::before {
      content: '★';
      position: absolute;
      left: 0;
      color: #ec4899;
      font-weight: 900;
    }

    /* 실전 퀴즈 테스트 카드 (자가 채점 시스템) */
    .quiz-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
    }
    .quiz-q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .quiz-badge {
      background: #10b981;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 10px;
    }
    .quiz-status-pill {
      font-size: 13px;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 10px;
    }
    .quiz-status-pill.unsolved { background: rgba(255,255,255,0.1); color: var(--text-dim); }
    .quiz-status-pill.correct { background: #10b981; color: #fff; }
    .quiz-status-pill.wrong { background: #ef4444; color: #fff; }

    .quiz-q-text {
      font-size: 16.5px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 14px;
      line-height: 1.6;
    }

    .quiz-input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .quiz-user-input {
      flex: 1;
      background: #090d16;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      padding: 10px 16px;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      outline: none;
    }
    .quiz-user-input:focus { border-color: #8b5cf6; }
    .btn-quiz-check {
      background: #8b5cf6;
      border: none;
      color: #fff;
      padding: 0 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-quiz-check:hover { background: #7c3aed; }

    .quiz-feedback {
      display: none;
      background: #090d16;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14.5px;
      line-height: 1.7;
    }
    .quiz-feedback.show { display: block; }
    .quiz-feedback.correct { border: 1px solid #10b981; color: #a7f3d0; }
    .quiz-feedback.wrong { border: 1px solid #ef4444; color: #fca5a5; }

    @media (max-width: 900px) {
      .math-wrapper { flex-direction: column; }
      .sidebar { width: 100%; position: static; }
      .content-panel { padding: 20px; }
      .unit-heading { font-size: 24px; }
    }
  </style>
</head>
<body>

  <!-- 상단 공통 네비게이션 헤더 -->
  <header>
    <div class="brand">
      <div class="brand-icon">🎓</div>
      <div>
        <div class="brand-title">초등 6학년 2학기 수학 마스터</div>
        <div class="brand-sub">개념정리 · 인터랙티브 계산 실험실 · 단원별 실전 퀴즈 & 자가채점</div>
      </div>
    </div>
    <div class="header-links">
      <a href="math-grade6-1.html" class="btn-portal" style="background:rgba(59,130,246,0.2); border-color:#3b82f6;">
        ◀ 6학년 1학기 보러가기
      </a>
      <a href="../index.html" class="btn-portal">
        🏠 메인 포털 허브
      </a>
    </div>
  </header>

  <!-- 2열 메인 레이아웃 -->
  <div class="math-wrapper">
    <!-- 좌측 단원 사이드바 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">📚 6학년 2학기 단원 목록</div>
        <div class="sidebar-desc">단원을 클릭하고 실전 문제에 도전하세요!</div>
      </div>
      <nav class="unit-list" id="unit-nav">
        <!-- JS 동적 생성 -->
      </nav>
    </aside>

    <!-- 우측 상세 콘텐츠 패널 -->
    <main class="content-panel" id="content-display">
      <!-- JS로 선택된 단원 상세 동적 렌더링 -->
    </main>
  </div>

  <script>
    /* ========================================================
       초등학교 6학년 2학기 수학 6대 단원 업그레이드 데이터베이스
       - 핵심 개념 공식
       - 인터랙티브 시각화 실험실 (Lab)
       - 시험 족집게 포인트
       - 실전 자가 채점 퀴즈 (Interactive Quiz with Answer Check)
       ======================================================== */
    const MATH_UNITS_6_2_ENHANCED = [
      {
        id: 'unit1',
        num: '1단원',
        title: '분수의 나눗셈',
        icon: '➗',
        summary: '분모가 같은 분수 나눗셈부터 분모가 다른 나눗셈, 자연수÷분수, 대분수÷분수까지 완벽하게 정복합니다.',
        lab: {
          title: '🧮 [실험실] 역수 곱셈 변환 계산기',
          desc: '나누는 분수를 뒤집어 곱셈으로 자동 변환되는 과정을 눈으로 확인해 보세요!',
          type: 'fraction-division'
        },
        concepts: [
          {
            title: '1. 분모가 같은 (분수) ÷ (분수)',
            desc: '분모가 같을 때는 분모를 무시하고 **분자끼리의 나눗셈**으로 바꾸어 계산합니다.',
            formula: '(▲/■) ÷ (●/■) = ▲ ÷ ● = ▲/●   (예: 5/7 ÷ 2/7 = 5 ÷ 2 = 5/2 = 2와 1/2)'
          },
          {
            title: '2. 분모가 다른 (분수) ÷ (분수) (통분 원리)',
            desc: '분모가 다를 때는 공통분모로 **통분**한 뒤 분자끼리 나누거나, 나누는 분수를 역수로 바꾸어 곱합니다.',
            formula: '3/4 ÷ 2/5 = (15/20) ÷ (8/20) = 15 ÷ 8 = 15/8 = 1과 7/8'
          },
          {
            title: '3. (자연수) ÷ (분수) 및 역수의 곱셈 공식',
            desc: '나누는 분수의 분자와 분모를 바꾼(역수) 후 곱셈으로 계산합니다.',
            formula: '▲ ÷ (●/■) = ▲ × (■/●)   (예: 6 ÷ 2/3 = 6 × 3/2 = 9)'
          },
          {
            title: '4. 대분수가 있는 분수의 나눗셈',
            desc: '대분수가 나오면 먼저 **가분수**로 고친 후, 역수의 곱셈으로 바꾸어 약분하여 풉니다.',
            formula: '2와 1/4 ÷ 3/8 = 9/4 ÷ 3/8 = 9/4 × 8/3 = (9×8)/(4×3) = 6'
          }
        ],
        points: [
          '나눗셈(÷)을 곱셈(×)으로 바꿀 때, 뒤에 오는 분수의 위아래(분자, 분모)만 뒤집어야 합니다. (앞의 분수는 절대 뒤집지 마세요!)',
          '대분수는 절대 그대로 역수를 취할 수 없습니다! 반드시 **가분수**로 고친 후에 뒤집으세요.',
          '계산 과정에서 약분을 먼저 진행하면 계산 실수를 거의 제로로 줄일 수 있습니다.'
        ],
        quizzes: [
          {
            q: '휘발유 4/5 L로 6 km를 달리는 오토바이가 있습니다. 이 오토바이는 휘발유 1 L로 몇 km를 갈 수 있을까요? (분수 또는 소수로 쓰세요)',
            answers: ['15/2', '7와 1/2', '7.5', '7과 1/2'],
            sol: '1 L로 갈 수 있는 거리는 (거리) ÷ (휘발유 양) = 6 ÷ 4/5 = 6 × 5/4 = 30/4 = 15/2 = 7.5 km 입니다.'
          },
          {
            q: '넓이가 3과 1/2 cm²이고 밑변의 길이가 7/8 cm인 평행사변형의 높이는 몇 cm일까요?',
            answers: ['4', '4cm'],
            sol: '높이 = (넓이) ÷ (밑변) = 3과 1/2 ÷ 7/8 = 7/2 ÷ 7/8 = 7/2 × 8/7 = 4 cm 입니다.'
          }
        ]
      },
      {
        id: 'unit2',
        num: '2단원',
        title: '소수의 나눗셈',
        icon: '🔢',
        summary: '(소수)÷(소수)의 계산에서 나누는 수와 나누어지는 수의 소수점을 똑같이 이동시키는 자릿수 마스터링!',
        lab: {
          title: '🔎 [실험실] 소수점 이동 & 나머지 검산기',
          desc: '몫과 남는 양(나머지)의 소수점 위치를 비교해 보세요.',
          type: 'decimal-division'
        },
        concepts: [

    const unitNav = document.getElementById('unit-nav');
    const contentDisplay = document.getElementById('content-display');
    let currentUnitIndex = 0;
    let currentStudyTab = 'concepts'; // 'concepts', 'lab', 'quizzes'

    // 단원별 퀴즈 정답 상태 저장소 (로컬)
    const quizStatusMap = {};

    function renderSidebar() {
      unitNav.innerHTML = '';
      MATH_UNITS_6_2_ENHANCED.forEach((unit, idx) => {
        const btn = document.createElement('button');
        btn.className = `unit-btn ${idx === currentUnitIndex ? 'active' : ''}`;
        
        // 정답 맞힌 개수 체크
        const unitSolved = quizStatusMap[unit.id] ? Object.values(quizStatusMap[unit.id]).filter(v => v === true).length : 0;
        const totalQ = unit.quizzes.length;
        const checkIcon = unitSolved === totalQ ? '✅' : (unitSolved > 0 ? '📝' : '⚪');

        btn.innerHTML = `
          <span class="unit-badge">${unit.num}</span>
          <span>${unit.icon} ${unit.title}</span>
          <span class="unit-check-badge" title="퀴즈 진행: ${unitSolved}/${totalQ}">${checkIcon}</span>
        `;
        btn.addEventListener('click', () => {
          selectUnit(idx);
        });
        unitNav.appendChild(btn);
      });
    }

    function selectUnit(idx) {
      currentUnitIndex = idx;
      currentStudyTab = 'concepts';
      document.querySelectorAll('.unit-btn').forEach((b, i) => {
        b.classList.toggle('active', i === idx);
      });

      renderUnitDetail(MATH_UNITS_6_2_ENHANCED[idx]);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

      let html = `

          <div class="unit-tag">${unit.num} 스마트 스터디</div>

          <p class="unit-summary">${unit.summary}</p>
        </div>

        <!-- 학습 모드 3단 탭 -->
        <div class="study-tabs">
          <button class="study-tab-btn ${currentStudyTab === 'concepts' ? 'active' : ''}" onclick="switchStudyTab('concepts')">
            💡 핵심 개념 & 족집게
          </button>
          <button class="study-tab-btn ${currentStudyTab === 'lab' ? 'active' : ''}" onclick="switchStudyTab('lab')">
            🧪 시각화 실험실 (Lab)
          </button>
          <button class="study-tab-btn ${currentStudyTab === 'quizzes' ? 'active' : ''}" onclick="switchStudyTab('quizzes')">
            ✍️ 실전 퀴즈 & 자가 채점
          </button>
        </div>
      `;

      // 1. 핵심 개념 탭 내용
      html += `<div id="tab-concepts" class="tab-content ${currentStudyTab === 'concepts' ? 'active' : ''}">`;
      html += `<div class="section-title">💡 핵심 개념 정리 (Concept Summary)</div>`;
      unit.concepts.forEach(c => {
        html += `
          <div class="concept-card">
            <div class="concept-card-title">${c.title}</div>
            <div class="concept-body">
              ${c.desc}
              ${c.formula ? `<div class="formula-box">📝 ${c.formula.replace(/\n/g, '<br>')}</div>` : ''}
            </div>
          </div>
        `;
      });

      html += `
        <div class="point-box">
          <div class="point-box-title">⚡ 시험 대비 족집게 핵심 포인트 (Key Points)</div>
          <ul class="point-list">
            ${unit.points.map(p => `<li>${p}</li>`).join('')}
          </ul>
        </div>
      </div>`;

      // 2. 시각화 실험실 탭 내용
      html += `<div id="tab-lab" class="tab-content ${currentStudyTab === 'lab' ? 'active' : ''}">`;
      html += `
        <div class="lab-box">
          <div class="lab-title">${unit.lab.title}</div>
          <div class="lab-desc">${unit.lab.desc}</div>
          ${renderLabWidget(unit)}
        </div>
      </div>`;

      // 3. 실전 퀴즈 & 자가 채점 탭 내용
      html += `<div id="tab-quizzes" class="tab-content ${currentStudyTab === 'quizzes' ? 'active' : ''}">`;
      html += `<div class="section-title">✍️ 개념 확인 실전 퀴즈 (자가 채점 시스템)</div>`;
      unit.quizzes.forEach((quiz, qIdx) => {
        const isSolved = quizStatusMap[unit.id] && quizStatusMap[unit.id][qIdx];
        const statusClass = isSolved ? 'correct' : 'unsolved';
        const statusText = isSolved ? '완료 (정답)' : '도전 전';

        html += `
          <div class="quiz-card" id="quiz-card-${qIdx}">
            <div class="quiz-q-header">
              <span class="quiz-badge">문제 ${qIdx + 1}</span>
              <span class="quiz-status-pill ${statusClass}" id="quiz-status-${qIdx}">${statusText}</span>
            </div>
            <div class="quiz-q-text">${quiz.q}</div>
            <div class="quiz-input-row">
              <input type="text" class="quiz-user-input" id="quiz-input-${qIdx}" placeholder="정답을 입력하세요 (예: 21)" autocomplete="off">
              <button class="btn-quiz-check" onclick="checkQuizAnswer(${qIdx})">정답 제출 ✔</button>
            </div>
            <div class="quiz-feedback" id="quiz-feedback-${qIdx}"></div>
          </div>
        `;
      });
      html += `</div>`;

      contentDisplay.innerHTML = html;
    }

    // 탭 전환 함수
    window.switchStudyTab = function(tabName) {
      currentStudyTab = tabName;
      document.querySelectorAll('.study-tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      const activeTabBtn = Array.from(document.querySelectorAll('.study-tab-btn')).find(b => b.getAttribute('onclick').includes(tabName));
      if (activeTabBtn) activeTabBtn.classList.add('active');

      const activeContent = document.getElementById(`tab-${tabName}`);
      if (activeContent) activeContent.classList.add('active');
    };

    // 실험실 위젯 렌더러
    function renderLabWidget(unit) {
      switch(unit.lab.type) {
        case 'fraction-division':
          return `
            <div class="lab-control-row">
              <span>(자연수)</span>
              <input type="number" id="lab-frac-n" class="lab-input" value="6">
              <span>÷ (분수)</span>
              <input type="number" id="lab-frac-a" class="lab-input" value="2" style="width:60px;"> /
              <input type="number" id="lab-frac-b" class="lab-input" value="3" style="width:60px;">
              <button class="lab-btn" onclick="calcFracLab()">역수 곱셈 변환</button>
            </div>
            <div class="lab-result-display" id="lab-frac-result">
              계산 공식: 6 ÷ (2/3) = 6 × (3/2) = (6 × 3) / 2 = 18 / 2 = 9
            </div>
          `;
        case 'decimal-division':
          return `
            <div class="lab-control-row">
              <span>나누어지는 수</span>
              <input type="number" step="0.1" id="lab-dec-a" class="lab-input" value="19.5">
              <span>÷ 나누는 수</span>
              <input type="number" step="0.1" id="lab-dec-b" class="lab-input" value="3">
              <button class="lab-btn" onclick="calcDecLab()">나머지 분석</button>
            </div>
            <div class="lab-result-display" id="lab-dec-result">
              19.5 ÷ 3 = 6상자 포장 가능, 원래 소수점에 따른 나머지 = 1.5 kg
            </div>
          `;
        case 'block-analyzer':
          return `
            <div class="lab-control-row">
              <span>각 칸의 층수 4개 입력:</span>
              <input type="number" id="b1" class="lab-input" value="3" style="width:50px;">
              <input type="number" id="b2" class="lab-input" value="2" style="width:50px;">
              <input type="number" id="b3" class="lab-input" value="1" style="width:50px;">
              <input type="number" id="b4" class="lab-input" value="3" style="width:50px;">
              <button class="lab-btn" onclick="calcBlockLab()">분석하기</button>
            </div>
            <div class="lab-result-display" id="lab-block-result">
              총 쌓기나무 개수: 3 + 2 + 1 + 3 = 9개 | 앞에서 본 최대 층수: 3층
            </div>
          `;
        case 'proportion-calc':
          return `
            <div class="lab-control-row">
              <span>비례식: 4 : 7 = 12 : □</span>
              <input type="number" id="prop-a" class="lab-input" value="4" style="width:50px;"> :
              <input type="number" id="prop-b" class="lab-input" value="7" style="width:50px;"> =
              <input type="number" id="prop-c" class="lab-input" value="12" style="width:50px;"> : □
              <button class="lab-btn" onclick="calcPropLab()">외항=내항 계산</button>
            </div>
            <div class="lab-result-display" id="lab-prop-result">
              외항의 곱(4 × □) = 내항의 곱(7 × 12 = 84) → □ = 21
            </div>
          `;
        case 'circle-calc':
          return `
            <div class="lab-control-row">
              <span>반지름(r):</span>
              <input type="number" id="lab-circle-r" class="lab-input" value="6"> cm
              <span>원주율:</span>
              <select id="lab-circle-pi" class="lab-input" style="width:90px;">
                <option value="3.14">3.14</option>
                <option value="3.1">3.1</option>
                <option value="3">3</option>
              </select>
              <button class="lab-btn" onclick="calcCircleLab()">원주 & 넓이 계산</button>
            </div>
            <div class="lab-result-display" id="lab-circle-result">
              지름 = 12 cm | 원주 = 12 × 3.14 = 37.68 cm | 원의 넓이 = 6 × 6 × 3.14 = 113.04 cm²
            </div>
          `;
        case 'cylinder-lab':
          return `
            <div class="lab-control-row">
              <span>밑면 반지름:</span>
              <input type="number" id="lab-cyl-r" class="lab-input" value="5"> cm
              <span>원기둥 높이:</span>
              <input type="number" id="lab-cyl-h" class="lab-input" value="10"> cm
              <button class="lab-btn" onclick="calcCylLab()">전개도 치수 확인</button>
            </div>
            <div class="lab-result-display" id="lab-cyl-result">
              전개도 옆면 직사각형 가로(원주) = (5 × 2) × 3.14 = 31.4 cm | 세로 = 10 cm
            </div>
          `;
        default:
          return `<div>실험실 준비 중</div>`;
      }
    }

    // 실험실 계산 로직들
    window.calcFracLab = function() {
      const n = parseFloat(document.getElementById('lab-frac-n').value) || 0;
      const a = parseFloat(document.getElementById('lab-frac-a').value) || 1;
      const b = parseFloat(document.getElementById('lab-frac-b').value) || 1;
      const res = (n * b) / a;
      document.getElementById('lab-frac-result').innerHTML = `
        계산 과정: ${n} ÷ (${a}/${b}) = ${n} × (${b}/${a}) = (${n * b}) / ${a} = <b>${res}</b>
      `;
    };

    window.calcDecLab = function() {
      const a = parseFloat(document.getElementById('lab-dec-a').value) || 0;
      const b = parseFloat(document.getElementById('lab-dec-b').value) || 1;
      const quotient = Math.floor(a / b);
      const remainder = (a - (quotient * b)).toFixed(2);
      document.getElementById('lab-dec-result').innerHTML = `
        ${a} ÷ ${b} = <b>${quotient}</b>(몫), 원래 소수점에 의한 남는 양(나머지) = <b>${parseFloat(remainder)}</b>
      `;
    };

    window.calcBlockLab = function() {
      const b1 = parseInt(document.getElementById('b1').value) || 0;
      const b2 = parseInt(document.getElementById('b2').value) || 0;
      const b3 = parseInt(document.getElementById('b3').value) || 0;
      const b4 = parseInt(document.getElementById('b4').value) || 0;
      const sum = b1 + b2 + b3 + b4;
      const maxL = Math.max(b1, b2, b3, b4);
      document.getElementById('lab-block-result').innerHTML = `
        총 쌓기나무 수: ${b1} + ${b2} + ${b3} + ${b4} = <b>${sum}개</b> | 최고 층수: <b>${maxL}층</b>
      `;
    };

    window.calcPropLab = function() {
      const a = parseFloat(document.getElementById('prop-a').value) || 1;
      const b = parseFloat(document.getElementById('prop-b').value) || 1;
      const c = parseFloat(document.getElementById('prop-c').value) || 1;
      const box = (b * c) / a;
      document.getElementById('lab-prop-result').innerHTML = `
        외항의 곱(${a} × □) = 내항의 곱(${b} × ${c} = ${b * c}) → □ = <b>${box}</b>
      `;
    };

    window.calcCircleLab = function() {
      const r = parseFloat(document.getElementById('lab-circle-r').value) || 0;
      const pi = parseFloat(document.getElementById('lab-circle-pi').value) || 3.14;
      const circum = (2 * r * pi).toFixed(2);
      const area = (r * r * pi).toFixed(2);
      document.getElementById('lab-circle-result').innerHTML = `
        지름 = ${r * 2} cm | 원주 = <b>${parseFloat(circum)} cm</b> | 원의 넓이 = <b>${parseFloat(area)} cm²</b>
      `;
    };

    window.calcCylLab = function() {
      const r = parseFloat(document.getElementById('lab-cyl-r').value) || 0;
      const h = parseFloat(document.getElementById('lab-cyl-h').value) || 0;
      const width = (2 * r * 3.14).toFixed(2);
      document.getElementById('lab-cyl-result').innerHTML = `
        옆면 직사각형 가로(원주) = <b>${parseFloat(width)} cm</b> | 세로(높이) = <b>${h} cm</b>
      `;
    };

    // 실전 퀴즈 자가 채점 시스템
    window.checkQuizAnswer = function(qIdx) {
      const unit = MATH_UNITS_6_2_ENHANCED[currentUnitIndex];
      const quiz = unit.quizzes[qIdx];
      const inputElem = document.getElementById(`quiz-input-${qIdx}`);
      const feedbackElem = document.getElementById(`quiz-feedback-${qIdx}`);
      const statusElem = document.getElementById(`quiz-status-${qIdx}`);
      const userVal = inputElem.value.trim().replace(/\s+/g, '');

      if (!userVal) {
        alert('정답을 입력해 주세요!');
        return;
      }

      // 복수 정답 매칭 검사
      const isCorrect = quiz.answers.some(ans => ans.replace(/\s+/g, '') === userVal);

      if (!quizStatusMap[unit.id]) quizStatusMap[unit.id] = {};

      feedbackElem.classList.remove('correct', 'wrong');
      feedbackElem.classList.add('show');

      if (isCorrect) {
        quizStatusMap[unit.id][qIdx] = true;
        feedbackElem.classList.add('correct');
        feedbackElem.innerHTML = `
          🎉 <b>정답입니다! 완벽해요!</b><br>
          <div style="margin-top:6px; color:#e2e8f0;">${quiz.sol}</div>
        `;
        statusElem.className = 'quiz-status-pill correct';
        statusElem.textContent = '정답 ✔';
      } else {
        quizStatusMap[unit.id][qIdx] = false;
        feedbackElem.classList.add('wrong');
        feedbackElem.innerHTML = `
          ❌ <b>아쉽네요. 다시 한 번 풀어보세요!</b><br>
          <div style="margin-top:6px; color:#e2e8f0;"><b>풀이 힌트 :</b> ${quiz.sol}</div>
        `;
        statusElem.className = 'quiz-status-pill wrong';
        statusElem.textContent = '오답 ❌';
      }

      renderSidebar();
    };

    // 초기 실행
    renderSidebar();
    selectUnit(0);
  </script>
</body>
</html>
