<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코스믹 스네이크 (Cosmic Snake)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle at center, #0f0c1b 0%, #05050a 100%);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 12px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #c084fc, #38bdf8, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(192, 132, 252, 0.4);
            font-weight: 800;
        }
        .scoreboard {
            display: flex;
            gap: 28px;
            margin-bottom: 16px;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 24px;
            border-radius: 30px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .scoreboard span strong {
            color: #38bdf8;
            font-size: 1.25rem;
            margin-left: 4px;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(147, 51, 234, 0.3), inset 0 0 20px rgba(56, 189, 248, 0.15);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(168, 85, 247, 0.4);
        }
        canvas {
            display: block;
            background: #020208;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 10, 0.82);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            transition: all 0.3s ease;
        }
        .overlay.hidden {
            display: none;
        }
        .overlay h2 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #f43f5e, #fb7185);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .overlay p {
            color: #cbd5e1;
            font-size: 1.05rem;
        }
        button {
            padding: 12px 28px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #0b0817;
            background: linear-gradient(135deg, #38bdf8, #c084fc);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.5);
            transition: all 0.25s ease;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.8);
        }
        .controls-hint {
            margin-top: 18px;
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }
        .mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 8px;
            margin-top: 14px;
        }
        .d-pad-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #c084fc;
            border-radius: 12px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: none;
            padding: 0;
        }
        .d-pad-btn:active {
            background: rgba(168, 85, 247, 0.3);
            transform: scale(0.95);
        }
        @media (max-width: 600px) {
            .mobile-controls {
                display: grid;
            }
        }
    </style>
</head>
<body>

    <h1>✨ COSMIC SNAKE ✨</h1>

    <div class="scoreboard">
        <span>별빛 점수: <strong id="score">0</strong></span>
        <span>최고 기록: <strong id="high-score">0</strong></span>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="460" height="460"></canvas>
        <div id="overlay" class="overlay">
            <h2 id="overlay-title">은하수 지렁이 여행</h2>
            <p id="overlay-msg">우주 속 성간 에너지를 모아 몸집을 키워보세요!</p>
            <button id="start-btn">탐사 시작</button>
        </div>
    </div>

    <div class="controls-hint">
        조작: <strong>방향키</strong> 또는 <strong>W, A, S, D</strong> | 일시정지: <strong>Space</strong>
    </div>

    <div class="mobile-controls">
        <div></div>
        <button class="d-pad-btn" onclick="handleDirection('UP')">▲</button>
        <div></div>
        <button class="d-pad-btn" onclick="handleDirection('LEFT')">◀</button>
        <div></div>
        <button class="d-pad-btn" onclick="handleDirection('RIGHT')">▶</button>
        <div></div>
        <button class="d-pad-btn" onclick="handleDirection('DOWN')">▼</button>
        <div></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');
        const startBtn = document.getElementById('start-btn');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('cosmic_snake_high') || 0;
        let isRunning = false;
        let isPaused = false;
        let nextDirection = { dx: 0, dy: -1 };

        // 프레임 애니메이션 및 시간 추적
        let lastStepTime = 0;
        const STEP_INTERVAL = 110; // 지렁이 이동 주기(ms)
        let cosmicTick = 0;

        // 배경 반짝이는 별들
        const backgroundStars = [];
        for (let i = 0; i < 75; i++) {
            backgroundStars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.6,
                twinkleSpeed: Math.random() * 0.04 + 0.015,
                phase: Math.random() * Math.PI * 2,
                color: ['#ffffff', '#a5f3fc', '#fbcfe8', '#e9d5ff'][Math.floor(Math.random() * 4)]
            });
        }

        // 별빛 가루 / 잔상 파티클 시스템
        const particles = [];

        function addParticle(x, y, color, size, speed, life) {
            const angle = Math.random() * Math.PI * 2;
            const spd = (Math.random() * 0.8 + 0.2) * speed;
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * spd,
                vy: Math.sin(angle) * spd,
                color: color,
                alpha: 1,
                decay: 1 / life,
                size: size
            });
        }

        function createFoodExplosion(x, y) {
            for (let i = 0; i < 28; i++) {
                const colors = ['#f472b6', '#38bdf8', '#c084fc', '#fef08a', '#ffffff'];
                const col = colors[Math.floor(Math.random() * colors.length)];
                addParticle(x, y, col, Math.random() * 4 + 2, 3.2, 45);
            }
        }

        highScoreEl.textContent = highScore;

        function initGame() {
            snake = [
                { x: 11, y: 12 },
                { x: 11, y: 13 },
                { x: 11, y: 14 },
                { x: 11, y: 15 }
            ];
            dx = 0;
            dy = -1;
            nextDirection = { dx: 0, dy: -1 };
            score = 0;
            scoreEl.textContent = score;
            spawnFood();
            isRunning = true;
            isPaused = false;
            overlay.classList.add('hidden');
            lastStepTime = performance.now();
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * TILE_COUNT);
                food.y = Math.floor(Math.random() * TILE_COUNT);
                valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
        }

        function updateGameStep() {
            dx = nextDirection.dx;
            dy = nextDirection.dy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 벽 충돌 (우주 경계)
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver();
                return;
            }

            // 자기 몸 충돌
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // 먹이 획득
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('cosmic_snake_high', highScore);
                }
                createFoodExplosion(
                    food.x * GRID_SIZE + GRID_SIZE / 2,
                    food.y * GRID_SIZE + GRID_SIZE / 2
                );
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function render(timestamp) {
            cosmicTick++;

            // 게임 스텝 업데이트 (부드러운 렌더링 루프 분리)
            if (isRunning && !isPaused) {
                if (timestamp - lastStepTime >= STEP_INTERVAL) {
                    updateGameStep();
                    lastStepTime = timestamp;
                }

                // 지렁이 몸통 뒤로 성운 별가루 트레일 방출
                if (snake.length > 0 && Math.random() < 0.7) {
                    const tail = snake[snake.length - 1];
                    addParticle(
                        tail.x * GRID_SIZE + GRID_SIZE / 2 + (Math.random() - 0.5) * 8,
                        tail.y * GRID_SIZE + GRID_SIZE / 2 + (Math.random() - 0.5) * 8,
                        `hsl(${(cosmicTick * 4 + snake.length * 15) % 360}, 100%, 75%)`,
                        Math.random() * 2.5 + 1,
                        0.8,
                        30
                    );
                }
            }

            // 1. 깊은 우주 배경 그리기
            ctx.fillStyle = '#030209';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 성운 오로라 효과 (부드러운 글로우)
            const nebGrad = ctx.createRadialGradient(
                canvas.width / 2 + Math.sin(cosmicTick * 0.02) * 50,
                canvas.height / 2 + Math.cos(cosmicTick * 0.02) * 50,
                20,
                canvas.width / 2,
                canvas.height / 2,
                240
            );
            nebGrad.addColorStop(0, 'rgba(126, 34, 206, 0.16)');
            nebGrad.addColorStop(0.5, 'rgba(14, 116, 144, 0.12)');
            nebGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = nebGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. 반짝이는 우주 배경 별들
            backgroundStars.forEach(star => {
                const alpha = (Math.sin(cosmicTick * star.twinkleSpeed + star.phase) + 1) / 2 * 0.8 + 0.2;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = star.color;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // 3. 성간 격자선 (우주 시공간 왜곡 그리드)
            ctx.strokeStyle = 'rgba(147, 51, 234, 0.07)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= canvas.width; i += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // 4. 파티클 업데이트 및 렌더링
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // 5. 먹이 (빛나는 신비로운 항성 / 펄서 에너지)
            const foodCenterX = food.x * GRID_SIZE + GRID_SIZE / 2;
            const foodCenterY = food.y * GRID_SIZE + GRID_SIZE / 2;
            const pulse = (Math.sin(cosmicTick * 0.15) + 1) / 2;
            const foodRadius = GRID_SIZE / 2 - 3 + pulse * 2.5;

            // 항성 외부 아우라
            ctx.save();
            ctx.shadowBlur = 18 + pulse * 14;
            ctx.shadowColor = '#f43f5e';
            ctx.fillStyle = '#ffedd5';
            ctx.beginPath();
            ctx.arc(foodCenterX, foodCenterY, foodRadius, 0, Math.PI * 2);
            ctx.fill();

            // 내부 코어
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.arc(foodCenterX, foodCenterY, foodRadius * 0.65, 0, Math.PI * 2);
            ctx.fill();

            // 십자 반짝임 빛살
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 1.5;
            const rayLen = 9 + pulse * 4;
            ctx.beginPath();
            ctx.moveTo(foodCenterX - rayLen, foodCenterY);
            ctx.lineTo(foodCenterX + rayLen, foodCenterY);
            ctx.moveTo(foodCenterX, foodCenterY - rayLen);
            ctx.lineTo(foodCenterX, foodCenterY + rayLen);
            ctx.stroke();
            ctx.restore();

            // 6. 코스믹 지렁이 렌더링 (빛나는 성운 & 은하수 그라데이션)
            if (snake.length > 0) {
                // 몸통 잔상 글로우
                ctx.save();
                ctx.shadowBlur = 14;
                ctx.shadowColor = '#38bdf8';

                snake.forEach((segment, index) => {
                    const cx = segment.x * GRID_SIZE + GRID_SIZE / 2;
                    const cy = segment.y * GRID_SIZE + GRID_SIZE / 2;
                    const progress = index / Math.max(snake.length, 1);

                    // 위치와 시간에 따라 유동적으로 변화하는 우주 은하수 색상 (Cosmic Hue)
                    const hue = (cosmicTick * 3 + index * 12) % 360;
                    const color = `hsl(${hue}, 95%, ${65 - progress * 15}%)`;
                    const radius = (GRID_SIZE / 2 - 1.5) * (1 - progress * 0.35);

                    ctx.fillStyle = color;
                    ctx.shadowColor = color;
                    ctx.beginPath();
                    ctx.arc(cx, cy, Math.max(radius, 3), 0, Math.PI * 2);
                    ctx.fill();

                    // 머리 장식 (신비로운 코어 및 은하수의 눈)
                    if (index === 0) {
                        ctx.fillStyle = '#ffffff';
                        ctx.shadowBlur = 16;
                        ctx.shadowColor = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(cx, cy, radius * 0.5, 0, Math.PI * 2);
                        ctx.fill();

                        // 머리 별빛 눈동자
                        let eyeOffsetX1 = 0, eyeOffsetY1 = 0;
                        let eyeOffsetX2 = 0, eyeOffsetY2 = 0;
                        const dist = 5;

                        if (dx === 1) { // 우
                            eyeOffsetX1 = 4; eyeOffsetY1 = -dist;
                            eyeOffsetX2 = 4; eyeOffsetY2 = dist;
                        } else if (dx === -1) { // 좌
                            eyeOffsetX1 = -4; eyeOffsetY1 = -dist;
                            eyeOffsetX2 = -4; eyeOffsetY2 = dist;
                        } else if (dy === 1) { // 하
                            eyeOffsetX1 = -dist; eyeOffsetY1 = 4;
                            eyeOffsetX2 = dist; eyeOffsetY2 = 4;
                        } else { // 상
                            eyeOffsetX1 = -dist; eyeOffsetY1 = -4;
                            eyeOffsetX2 = dist; eyeOffsetY2 = -4;
                        }

                        ctx.fillStyle = '#38bdf8';
                        ctx.beginPath();
                        ctx.arc(cx + eyeOffsetX1, cy + eyeOffsetY1, 2, 0, Math.PI * 2);
                        ctx.arc(cx + eyeOffsetX2, cy + eyeOffsetY2, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
                ctx.restore();
            }

            requestAnimationFrame(render);
        }

        function gameOver() {
            isRunning = false;
            overlayTitle.textContent = '차원 붕괴! (Game Over)';
            overlayTitle.style.background = 'linear-gradient(135deg, #f43f5e, #fb7185)';
            overlayTitle.style.webkitBackgroundClip = 'text';
            overlayMsg.innerHTML = `수집한 우주 에너지: <strong>${score}점</strong>`;
            startBtn.textContent = '새로운 탐사 시작';
            overlay.classList.remove('hidden');

            // 게임 오버 폭발 효과
            if (snake.length > 0) {
                createFoodExplosion(
                    snake[0].x * GRID_SIZE + GRID_SIZE / 2,
                    snake[0].y * GRID_SIZE + GRID_SIZE / 2
                );
            }
        }

        function handleDirection(dir) {
            if (!isRunning) return;

            if (dir === 'UP' && dy !== 1) {
                nextDirection = { dx: 0, dy: -1 };
            } else if (dir === 'DOWN' && dy !== -1) {
                nextDirection = { dx: 0, dy: 1 };
            } else if (dir === 'LEFT' && dx !== 1) {
                nextDirection = { dx: -1, dy: 0 };
            } else if (dir === 'RIGHT' && dx !== -1) {
                nextDirection = { dx: 1, dy: 0 };
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (isRunning) {
                    isPaused = !isPaused;
                    if (isPaused) {
                        overlayTitle.textContent = '차원 왜곡 (일시 정지)';
                        overlayTitle.style.background = 'linear-gradient(135deg, #38bdf8, #818cf8)';
                        overlayTitle.style.webkitBackgroundClip = 'text';
                        overlayMsg.textContent = 'Space 키를 눌러 시간의 흐름을 재개하세요.';
                        startBtn.textContent = '계속 진행';
                        overlay.classList.remove('hidden');
                    } else {
                        overlay.classList.add('hidden');
                        lastStepTime = performance.now();
                    }
                }
                return;
            }

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    handleDirection('UP');
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    handleDirection('DOWN');
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    handleDirection('LEFT');
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    handleDirection('RIGHT');
                    e.preventDefault();
                    break;
            }
        });

        startBtn.addEventListener('click', () => {
            if (isPaused) {
                isPaused = false;
                overlay.classList.add('hidden');
                lastStepTime = performance.now();
            } else {
                initGame();
            }
        });

        // 애니메이션 렌더링 루프 시작
        spawnFood();
        snake = [
            { x: 11, y: 12 },
            { x: 11, y: 13 },
            { x: 11, y: 14 }
        ];
        requestAnimationFrame(render);
    </script>
</body>
</html>
